name: Community Hub checks

on:
  pull_request:
    paths:
      - "community.js"
      - "community.html"
      - "sw.js"
      - "package.json"
      - "wrangler.example.toml"
      - ".gitignore"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/community-checks.yml"
  push:
    branches:
      - main
    paths:
      - "community.js"
      - "community.html"
      - "sw.js"
      - "package.json"
      - "wrangler.example.toml"
      - ".gitignore"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/community-checks.yml"

permissions:
  contents: read

jobs:
  syntax-and-schema:
    name: JavaScript syntax and SQL schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run Worker tests
        run: npm test
      - name: Check Community Hub DOM references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)

          parser = IdParser()
          parser.feed(Path("community.html").read_text(encoding="utf-8"))
          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          js = Path("community.js").read_text(encoding="utf-8")
          references = set(re.findall(r'\$\("([^"]+)"\)', js))
          missing = sorted(references - set(parser.ids))
          if duplicates or missing:
              raise SystemExit(f"Duplicate HTML ids: {duplicates}; missing JS targets: {missing}")
          print(f"DOM references OK: {len(references)} JavaScript targets found.")
          PY
      - name: Validate D1 schema with SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          import tomllib
          from pathlib import Path

          connection = sqlite3.connect(":memory:")
          schema = Path("backend/schema.sql").read_text(encoding="utf-8")
          connection.executescript(schema)

          migration_connection = sqlite3.connect(":memory:")
          migration = Path("backend/migrations/0001_initial.sql").read_text(encoding="utf-8")
          migration_connection.executescript(migration)

          def schema_objects(db):
              return list(db.execute(
                  "SELECT type, name, tbl_name, sql FROM sqlite_master "
                  "WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name"
              ))

          if schema_objects(connection) != schema_objects(migration_connection):
              raise SystemExit("Initial D1 migration does not match backend/schema.sql.")

          reservation_sql = (
              "INSERT INTO auth_attempts(key_hash,attempted_at) "
              "SELECT ?,? WHERE (SELECT COUNT(*) FROM auth_attempts "
              "WHERE key_hash=? AND attempted_at>?) < ?"
          )
          window_now = 2_000_000_000
          for _ in range(10):
              inserted = connection.execute(
                  reservation_sql, ("rate-test", window_now, "rate-test", window_now - 900, 10)
              )
              if inserted.rowcount != 1:
                  raise SystemExit("Atomic auth reservation blocked an attempt below the configured threshold.")
          blocked = connection.execute(
              reservation_sql, ("rate-test", window_now, "rate-test", window_now - 900, 10)
          )
          if blocked.rowcount != 0:
              raise SystemExit("Atomic auth reservation admitted an attempt at the configured threshold.")

          expected = {"users", "sessions", "content", "announcements", "push_subscriptions", "auth_attempts"}
          actual = {
              row[0] for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing schema tables: {sorted(missing)}")

          try:
              connection.execute(
                  "INSERT INTO users(username,email,display_name,role,password_hash) VALUES(?,?,?,?,?)",
                  ("invalid-role", "invalid@example.test", "Invalid Role", "superuser", "not-a-real-hash"),
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit("Users table accepted an invalid role.")

          connection.execute(
              "INSERT INTO users(username,email,display_name,role,password_hash) VALUES(?,?,?,?,?)",
              ("schema-test", "schema-test@example.test", "Schema Test", "member", "not-a-real-hash"),
          )
          try:
              connection.execute(
                  "INSERT INTO users(username,email,display_name,role,password_hash) VALUES(?,?,?,?,?)",
                  ("SCHEMA-TEST", "duplicate@example.test", "Duplicate Test", "admin", "not-a-real-hash"),
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit("Username uniqueness is not case-insensitive.")

          try:
              connection.execute(
                  "INSERT INTO users(username,email,display_name,role,password_hash) VALUES(?,?,?,?,?)",
                  ("email-duplicate", "SCHEMA-TEST@EXAMPLE.TEST", "Duplicate Email", "member", "not-a-real-hash"),
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit("Email uniqueness is not case-insensitive.")

          print(f"Schema and initial migration match: {len(expected)} expected tables and core constraints validated.")

          wrangler_template = Path("wrangler.example.toml").read_text(encoding="utf-8")
          required_config = [
              'ALLOWED_ORIGIN = "https://REPLACE_WITH_APPROVED_STAGING_ORIGIN"',
              'crons = ["17 3 * * *"]',
              'binding = "DB"',
              'binding = "MEDIA"',
              'migrations_dir = "backend/migrations"',
              'REPLACE_WITH_VERIFIED_STAGING_D1_DATABASE_ID',
              'REPLACE_WITH_APPROVED_STAGING_R2_BUCKET',
          ]
          missing_config = [value for value in required_config if value not in wrangler_template]
          if missing_config:
              raise SystemExit(f"Wrangler staging template is missing required safety/config entries: {missing_config}")

          parsed_config = tomllib.loads(wrangler_template)
          if parsed_config["vars"].get("ALLOWED_ORIGIN") != "https://REPLACE_WITH_APPROVED_STAGING_ORIGIN":
              raise SystemExit("Wrangler ALLOWED_ORIGIN placeholder is not the expected staging-only value.")
          if parsed_config["triggers"].get("crons") != ["17 3 * * *"]:
              raise SystemExit("Wrangler staging template must declare the expected daily Cron Trigger.")
          if parsed_config["d1_databases"][0].get("migrations_dir") != "backend/migrations":
              raise SystemExit("Wrangler D1 migration directory does not match the repository.")
          print("Wrangler TOML parses and contains required staging placeholders and scheduled-cleanup declaration.")
          PY
