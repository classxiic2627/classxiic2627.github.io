# Safe configuration template for a NEW, isolated staging environment.
# Copy to wrangler.toml locally, replace every placeholder with reviewed staging
# resource IDs/names, and keep the filled file out of Git. Never point this at
# production or run migrations until the target database has been inventoried.
name = "class-xii-c-community-hub-api-staging"
main = "backend/worker.js"
compatibility_date = "2026-10-19"

[vars]
# Replace with the exact HTTPS origin of the approved staging site (no trailing slash).
ALLOWED_ORIGIN = "https://REPLACE_WITH_APPROVED_STAGING_ORIGIN"
GOOGLE_CLIENT_ID = "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID"
GOOGLE_DRIVE_FOLDER_ID = "REPLACE_WITH_DEDICATED_DRIVE_FOLDER_ID"
# Generate these locally with: node scripts/generate-vapid-keys.mjs
VAPID_PUBLIC_KEY = "REPLACE_WITH_GENERATED_VAPID_PUBLIC_KEY"
VAPID_SUBJECT = "mailto:replace-with-a-monitored-address@example.com"

[triggers]
# Required for the Worker scheduled() cleanup handler. Verify this trigger in staging.
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "community-hub-staging"
database_id = "REPLACE_WITH_VERIFIED_STAGING_D1_DATABASE_ID"
migrations_dir = "backend/migrations"

# Store GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN, SETUP_SECRET, and VAPID_PRIVATE_KEY with
# wrangler secret put; never place those values in this file or Git.
